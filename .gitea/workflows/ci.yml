name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  SKUD_REPOSITORY: bth/pinvideo-skud

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      app-database:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pacs_testing
          POSTGRES_PASSWORD: pacs_testing
          POSTGRES_DB: pacs_testing
        options: >-
          --health-cmd "pg_isready -U pacs_testing -d pacs_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinvideo-skud
        env:
          SKUD_REPO_TOKEN: ${{ secrets.SKUD_REPO_TOKEN }}
        run: |
          rm -rf ../packages/pinvideo-skud
          mkdir -p ../packages
          git clone --depth 1 \
            "https://ci:${SKUD_REPO_TOKEN}@${GITHUB_SERVER_URL#https://}/${SKUD_REPOSITORY}.git" \
            ../packages/pinvideo-skud

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_pgsql, pgsql, gd, zip, pcntl, redis
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Prepare testing database
        run: |
          for i in $(seq 1 30); do
            php -r 'new PDO("pgsql:host=app-database;dbname=pacs_testing", "pacs_testing", "pacs_testing");' 2>/dev/null && break
            sleep 2
          done
          php -r '(new PDO("pgsql:host=app-database;dbname=pacs_testing", "pacs_testing", "pacs_testing"))
            ->exec("COMMENT ON DATABASE pacs_testing IS '\''pinvideo-pacs:testing'\''");'

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  docker:
    name: Production image build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [tests, frontend]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinvideo-skud
        env:
          SKUD_REPO_TOKEN: ${{ secrets.SKUD_REPO_TOKEN }}
        run: |
          rm -rf packages/pinvideo-skud
          mkdir -p packages
          git clone --depth 1 \
            "https://ci:${SKUD_REPO_TOKEN}@${GITHUB_SERVER_URL#https://}/${SKUD_REPOSITORY}.git" \
            packages/pinvideo-skud

      - name: Build app and horizon images
        run: |
          docker build -f docker/prod/php/Dockerfile --target app -t "ci-pacs:${GITHUB_RUN_ID}-app" .
          docker build -f docker/prod/php/Dockerfile --target horizon -t "ci-pacs:${GITHUB_RUN_ID}-horizon" .

      - name: Smoke test
        run: |
          docker run --rm --entrypoint php "ci-pacs:${GITHUB_RUN_ID}-app" artisan --version

      - name: Cleanup
        if: always()
        run: docker rmi -f "ci-pacs:${GITHUB_RUN_ID}-app" "ci-pacs:${GITHUB_RUN_ID}-horizon" 2>/dev/null || true
