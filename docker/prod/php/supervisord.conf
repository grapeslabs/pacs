[supervisord]
nodaemon=true
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[inet_http_server]
port=0.0.0.0:9001
username=%(ENV_SUPERVISOR_HTTP_USER)s
password=%(ENV_SUPERVISOR_HTTP_PASS)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001
username=%(ENV_SUPERVISOR_HTTP_USER)s
password=%(ENV_SUPERVISOR_HTTP_PASS)s

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
user=app
command=php /var/www/html/artisan queue:work --sleep=1 --tries=3 --timeout=90
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:queue-sync]
process_name=%(program_name)s_%(process_num)02d
user=app
command=php /var/www/html/artisan queue:work redis-sync --queue=sync --sleep=1 --tries=3 --timeout=600
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:queue-actuators]
process_name=%(program_name)s_%(process_num)02d
user=app
command=php /var/www/html/artisan queue:work redis-actuators --queue=actuators --sleep=1 --tries=1 --timeout=8
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:events-processor]
process_name=%(program_name)s
user=app
command=php /var/www/html/artisan events:process-new
environment=LOG_SOURCE="events",APP_CONFIG_CACHE="/var/www/html/bootstrap/cache/config-events.php"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:lpr-rules-processor]
process_name=%(program_name)s
user=app
command=php /var/www/html/artisan lpr:process-rules
environment=LOG_SOURCE="lpr-rules",APP_CONFIG_CACHE="/var/www/html/bootstrap/cache/config-lpr-rules.php"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:frpc]
process_name=%(program_name)s
user=app
command=/usr/local/bin/frpc -c /var/www/html/storage/app/frp/frpc.toml
autostart=false
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0