[supervisord]
nodaemon=true
user=root
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[inet_http_server]
port=0.0.0.0:9001
username=%(ENV_SUPERVISOR_HTTP_USER)s
password=%(ENV_SUPERVISOR_HTTP_PASS)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001
username=%(ENV_SUPERVISOR_HTTP_USER)s
password=%(ENV_SUPERVISOR_HTTP_PASS)s

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
user=laravel
command=php /var/www/html/artisan queue:work --sleep=1 --tries=3 --timeout=90
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:frpc]
process_name=%(program_name)s
user=laravel
command=/usr/local/bin/frpc -c /var/www/html/storage/app/frp/frpc.toml
autostart=false
autorestart=true
startretries=3
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0